# Releases a validated af3jax image WITHOUT rebuilding it: the release is the very image (the same digest) that passed the Setonix
# checks. A rebuild would be a different image, and could even compile a different AlphaFold 3 wheel (the build takes that day's wwPDB
# dictionary).
#   Actions tab -> "af3jax release" -> Run workflow, or: gh workflow run af3jax-release.yml -f source=sha-95747e1 -f version=3.1.4-1
#     source   the validated image: its tag (sha-<commit>) or digest (sha256:...)
#     version  <AlphaFold 3 version>-<port revision>, e.g. 3.1.4-1; the revision counts changes to the port on the same AlphaFold 3
#              release (wrapper, recipe)
# Publishes :<version> (never moves), :<AlphaFold 3 version> (the newest port revision of that release) and :latest, all pointing at
# the source digest, and tags the image's source commit af3jax-v<version>.
name: af3jax release

on:
  workflow_dispatch:
    inputs:
      source:
        description: "validated image: a tag (sha-<commit>) or a digest (sha256:...)"
        required: true
      version:
        description: "AlphaFold 3 version + port revision, e.g. 3.1.4-1"
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: af3jax-release

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote
        env:
          SOURCE: ${{ inputs.source }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/af3jax
          [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([1-9][0-9]*)$ ]] || { echo "version $VERSION: expected <AF3 version>-<revision>, e.g. 3.1.4-1"; exit 1; }
          AF3=${BASH_REMATCH[1]}
          case "$SOURCE" in sha256:*) REF="$IMAGE@$SOURCE";; sha-*) REF="$IMAGE:$SOURCE";; *) echo "source $SOURCE: sha-<commit> or sha256:<digest>"; exit 1;; esac
          DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' | jq -r '.digest // empty')
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "$REF: no such image"; exit 1; }
          REV=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Image}}' | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty')
          [[ "$REV" =~ ^[0-9a-f]{40}$ ]] || { echo "$REF carries no source commit label: not an image of this repository's build"; exit 1; }
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "$IMAGE:$VERSION already exists: a release never moves, so pick the next port revision"; exit 1
          fi
          docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:$AF3" --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          got=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          [ "$got" = "$DIGEST" ] || { echo "the release digest $got differs from the source $DIGEST"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/af3jax-v$VERSION" -f sha="$REV" > /dev/null
          {
            echo "released \`$IMAGE:$VERSION\` (also \`:$AF3\` and \`:latest\`)"
            echo
            echo "digest \`$DIGEST\`, the same image as \`$REF\`; source commit \`$REV\`, tagged \`af3jax-v$VERSION\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
