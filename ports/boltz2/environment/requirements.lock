# Setonix port stack: the packages the native Boltz-2 port imports, at the versions it validated. The native venv
# (/scratch/pawsey1018/gbouras/boltz2-setonix/venv) is LAYERED on the OpenFold3 conda env (--system-site-packages): its own 31 packages
# plus torch, triton-rocm and the support packages it inherits from that base. This list is the closure of boltz 2.2.1's requirements
# (with pytorch-lightning's fsspec[http] extra) over that effective environment, read from its installed metadata on 2026-10-11, each at
# the version the native process resolves. Left out on purpose, as natively: boltz itself (installed from the kit's own wheel,
# kit/boltz2/stock/), the kit's two packages (editable), wandb and types-requests (declared by boltz, never imported at inference; the
# native tree inherits a wandb 0.30.0 it never loads), and every CUDA / cuEquivariance package (no CUDA, no cuEquivariance on ROCm).
# torch and triton-rocm come from download.pytorch.org/whl/rocm7.2 (the native torch/lib files have the same sha256 as that wheel's).
