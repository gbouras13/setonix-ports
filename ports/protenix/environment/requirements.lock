# Setonix port stack: the packages the native Protenix v2 port imports, at the versions it validated. The native venv
# (/scratch/pawsey1018/gbouras/protenix-setonix/venv) is LAYERED on the OpenFold3 conda env (--system-site-packages): its own pins
# (scripts/setup-venv.sh: biotite 1.4.0, pandas 2.3.1, scikit-learn 1.7.1, biopython 1.85, optree 0.17.0, fair-esm 2.0.0 and their
# support packages) plus torch, triton-rocm and the packages it inherits from that base. This list is the closure of those roots'
# declared requirements (protenix 2.0.0's, the kit's two packages', torch's) over that effective environment, read from its installed
# metadata on 2026-10-14, each at the version the native process resolves, plus lmdb (imported by protenix.utils.file_io, declared by
# nothing). Left out on purpose, as natively: protenix itself (installed from the kit's own wheel, kit/protenix_v2/stock/), the kit's
# two packages (editable), every CUDA / cuEquivariance package (none on ROCm), and what protenix declares but never imports at
# inference (deepspeed, torchvision, torchaudio, matplotlib, ipywidgets, py3Dmol, modelcif, scikit-learn-extra, icecream, ipdb; wandb
# is imported by runner/train.py only -- the native tree inherits a wandb 0.30.0 it never loads).
# torch and triton-rocm come from download.pytorch.org/whl/rocm7.2.
