# The ESMFold2 port's Python stack, exactly as the native venv on Setonix ran it (pip freeze --all of
# /scratch/pawsey1018/gbouras/esmfold2-setonix/venv, 2026-10-15, unchanged since; every result in af3-setonix/ESMFOLD2_PORT.md came from it).
# It is the kit's own lock (kit/esmfold2/environment/requirements.lock) with torch 2.14.0+rocm7.2 / triton-rocm 3.8.0 in place of the
# CUDA torch / triton, without the CUDA runtime wheels (nvidia-*, cuda-*) and the CUDA accelerated layer (flash_attn,
# transformer_engine, xformers: sm_90 builds that do not exist for ROCm), plus pytest (the kit's CPU tests). The Dockerfile installs
# pip first, then every other line with --no-deps (torch from download.pytorch.org/whl/rocm7.2, the rest from PyPI; esm, transformers
# and dockq from git at the commits written here, as the kit's lock does), then the kit's two packages editable from kit/, as the
# kit's own `run.sh install` does. The build fails if the image's freeze differs from this file.
