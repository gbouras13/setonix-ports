# Setonix port stack: the packages the native OpenDDE port imports, at the versions it validated. The native venv
# (/scratch/pawsey1018/gbouras/opendde-setonix/venv) is LAYERED on the OpenFold3 conda env (--system-site-packages): its own packages
# (scripts/setup-venv.sh installed OpenDDE's pins there with --ignore-installed) plus torch, triton-rocm, rdkit, pydantic and the support
# packages it inherits from that base. This list is the closure of opendde 1.1.1's requirements over that effective environment, read
# from its installed metadata on 2026-10-14, each at the version the native process resolves (the venv before the base).
# Left out on purpose, as natively:
#   - opendde itself (installed from the kit's own wheel, kit/opendde/stock/) and the kit's two packages (editable, from the kit);
#   - setuptools and wheel (installed first, at the native venv's versions, by the Dockerfile);
#   - opendde_opt's two declared dependencies: cuda-bindings (CUDA only) and ninja (upstream's fused LayerNorm JIT needs nvcc;
#     LAYERNORM_TYPE=torch here, as natively);
#   - the "gpu" extra (triton 3.3.1 and cuEquivariance: CUDA only; torch's ROCm build brings triton-rocm).
# Where the native venv holds two metadata directories for one package (scikit-learn 1.7.1 / 1.9.1, optree 0.17.0 / 0.20.0: an earlier
# unpinned install, then setup-venv.sh's pinned --ignore-installed one over it), the pinned version is the one installed last, and the
# one opendde 1.1.1 itself pins. Not honoured, as natively: opendde's own pins torch==2.7.1 (the ROCm build stays), numpy==2.4.1 and
# rdkit==2025.9.3 (the native process runs numpy 2.5.3 and rdkit 2025.9.6, which it inherits).
# cloudpickle is joblib 1.6.0's requirement (found by simulating pip check from the indexes' metadata).
# torch and triton-rocm come from download.pytorch.org/whl/rocm7.2.
